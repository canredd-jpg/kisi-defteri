<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b58">
<meta name="description" content="Konuştuğun insanlardan öğrendiğin özel günleri, sağlık haberlerini ve hobileri tuttuğun kişisel defter.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kişi Defteri</title>
<meta name="apple-mobile-web-app-title" content="Kişi Defteri">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* Layout: telefon uygulaması. Üstte yapışkan başlık, altta sekme çubuğu, sağ altta ekle düğmesi. Kayıtlar sakin kartlar; kategori küçük renkli noktayla. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#15201c; --muted:#5b6964; --line:#d9e1dd;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --c-ozel:#c2581c; --c-saglik:#c0334d; --c-aile:#6a4fc2; --c-hobi:#2f8a4c; --c-is:#2b6aa6; --c-diger:#6b7772;
  --shadow:0 6px 20px rgba(21,32,28,.12);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#17201d; --ink:#e4ebe8; --muted:#93a29d; --line:#2a3531;
    --accent:#5cc4a6; --accent-ink:#0b1714; --accent-soft:#1c3a32;
    --c-ozel:#f0915a; --c-saglik:#f07a8e; --c-aile:#a996f2; --c-hobi:#6fd08f; --c-is:#74aee6; --c-diger:#9aa7a2;
    --shadow:0 6px 20px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#17201d; --ink:#e4ebe8; --muted:#93a29d; --line:#2a3531;
  --accent:#5cc4a6; --accent-ink:#0b1714; --accent-soft:#1c3a32;
  --c-ozel:#f0915a; --c-saglik:#f07a8e; --c-aile:#a996f2; --c-hobi:#6fd08f; --c-is:#74aee6; --c-diger:#9aa7a2;
  --shadow:0 6px 20px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
header.top h1{font:700 26px/1.15 var(--f-display);margin:0;flex:1;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.iconbtn svg{width:22px;height:22px}

.sub{color:var(--muted);font-size:14px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.section > h2{font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
button.row:hover{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .title{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--f-display);flex:none}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.when{flex:none;width:58px;text-align:center;border-radius:12px;padding:6px 0;background:var(--bg);font-variant-numeric:tabular-nums}
.when b{display:block;font:700 20px/1.1 var(--f-display)}
.when span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.when.today{background:var(--accent);color:var(--accent-ink)}
.when.today span{color:var(--accent-ink)}

.cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--dot);display:inline-block}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot)}

.entry{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.entry:first-child{border-top:0}
.entry .text{white-space:pre-wrap;overflow-wrap:anywhere}
.entry .foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.entry .acts{margin-left:auto;display:flex;gap:4px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 6px;border-radius:8px;font-size:14px}
.linkbtn.danger{color:var(--c-saglik)}

.profile{padding:16px;display:flex;flex-direction:column;gap:8px}
.profile .facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}

input[type=search],input[type=text],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
textarea{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 17px var(--f-display);margin-bottom:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--c-saglik)}
.btn.block{width:100%}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.fab svg{width:26px;height:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}

dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(10,16,14,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h3{margin:0;font:700 21px var(--f-display)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .btns{display:flex;gap:10px;justify-content:flex-end}
@media (max-width:420px){.sheet .two{grid-template-columns:1fr}}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick label{display:inline-flex}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick span{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.catpick span i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.catpick input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.catpick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--c-hobi)}
.status.warn i{background:var(--c-ozel)}
.help{padding:16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.help ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="backBtn" hidden aria-label="Geri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">Yaklaşanlar</h1>
    <span id="headActs"></span>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Ekle">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs"><div class="in">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Yaklaşanlar
  </button>
  <button data-tab="people">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.4 4.6 4"/></svg>
    Kişiler
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    Diğer
  </button>
</div></nav>

<dialog id="personDlg">
  <form class="sheet" id="personForm">
    <div class="grab"></div>
    <h3 id="personDlgTitle">Yeni kişi</h3>
    <label class="f">Ad soyad<input type="text" id="pName" name="name" required autocomplete="off"></label>
    <div class="two">
      <label class="f">Yakınlık<input type="text" id="pRel" name="relation" placeholder="Arkadaş, müşteri, komşu…" autocomplete="off"></label>
      <label class="f">Doğum günü<input type="date" id="pBirth" name="birthday"></label>
    </div>
    <label class="f">Genel not<textarea id="pNote" name="note" placeholder="Nasıl tanıştınız, nelerden hoşlanır…"></textarea></label>
    <div class="btns">
      <button type="button" class="btn" data-close>Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="entryDlg">
  <form class="sheet" id="entryForm">
    <div class="grab"></div>
    <h3 id="entryDlgTitle">Yeni bilgi</h3>
    <label class="f" id="ePersonWrap">Kimin hakkında?
      <select id="ePerson"></select>
    </label>
    <label class="f" id="eNewNameWrap" hidden>Yeni kişinin adı<input type="text" id="eNewName" autocomplete="off"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)">Kategori
      <div class="catpick" id="eCats"></div>
    </div>
    <label class="f">Ne öğrendin?<textarea id="eText" required placeholder="Örn: Kızı Elif'in doğum günü · Annesi ameliyat oldu · Balık tutmayı seviyor"></textarea></label>
    <div class="two">
      <label class="f">Tarih (isteğe bağlı)<input type="date" id="eDate"></label>
      <div style="display:flex;flex-direction:column;justify-content:flex-end">
        <label class="check"><input type="checkbox" id="eYearly"> Her yıl tekrarlar</label>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="eFollow"> Sonra sor (ör. “Annen nasıl oldu?”)</label>
    <div class="btns">
      <button type="button" class="btn" data-close>Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="confirmTitle">Emin misin?</h3>
    <div id="confirmText" class="sub"></div>
    <div class="btns">
      <button type="button" class="btn" id="confirmNo">Vazgeç</button>
      <button type="button" class="btn primary" id="confirmYes">Sil</button>
    </div>
  </div>
</dialog>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = {
  ozel:{name:'Özel gün', color:'var(--c-ozel)'},
  saglik:{name:'Sağlık', color:'var(--c-saglik)'},
  aile:{name:'Aile', color:'var(--c-aile)'},
  hobi:{name:'Hobi', color:'var(--c-hobi)'},
  is:{name:'İş / Okul', color:'var(--c-is)'},
  diger:{name:'Diğer', color:'var(--c-diger)'}
};
const LOCAL_KEY = 'kisi-defteri-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------------- storage ---------------- */
const store = {
  mode: 'loading',   // loading | cloud | local
  people: [],
  col: null,
  queue: new Map(),
  async init(){
    let db = null, user = null, id = null;
    try {
      [db, user] = await Promise.all([window.claude?.use?.('db'), window.claude?.use?.('user')]);
      id = user ? await user.id() : null;
      if (user && (await user.can('data.write')) === false) id = null;
    } catch(e){}
    if (db && id){
      this.col = db.collection('data/users/' + id);
      this.mode = 'cloud';
      let gotFirm = false;
      const timer = setTimeout(() => { if(!gotFirm){ ui.offline = true; render(); } }, 10000);
      this.unsub = this.col.onSnapshot(snap => {
        this.people = snap.docs.map(d => ({ id:d.id, ...structuredClone(d.data()) }));
        if (!snap.metadata.fromCache){ gotFirm = true; clearTimeout(timer); ui.offline = false; }
        ui.loaded = true; render();
      }, err => { clearTimeout(timer); ui.offline = true; ui.loaded = true; render(); });
    } else {
      this.mode = 'local';
      try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d && Array.isArray(d.people)) this.people = d.people; } catch(e){}
      ui.loaded = true; render(); syncReminders();
    }
  },
  goLocal(){
    // Hesaba yazma izni yoksa (ör. herkese açık linkle gelen biri) kayıtları bu cihazda tut.
    if (this.mode === 'local') return;
    try { this.unsub && this.unsub(); } catch(e){}
    let saved = [];
    try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY)); if (d && Array.isArray(d.people)) saved = d.people; } catch(e){}
    const ids = new Set(this.people.map(p => p.id));
    this.people = [...this.people, ...saved.filter(p => !ids.has(p.id))];
    this.mode = 'local'; ui.offline = false; this.saveLocal(); render();
    toast('Kayıtların bu cihazda tutuluyor');
  },
  saveLocal(){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify({people:this.people})); } catch(e){ toast('Bu cihazda kaydedilemedi'); } syncReminders(); },
  async save(p){
    const i = this.people.findIndex(x => x.id === p.id);
    if (i >= 0) this.people[i] = p; else this.people.push(p);
    render();
    if (this.mode === 'local'){ this.saveLocal(); return; }
    const { id, ...body } = p;
    const prev = this.queue.get(id) || Promise.resolve();
    const next = prev.then(() => this.col.doc(id).set(JSON.parse(JSON.stringify(body)))).catch(e => {
      if (['invalid_argument','not_granted','revoked','capability_disabled','capability_removed'].includes(e?.code)){ this.goLocal(); return; }
      toast(e?.code === 'quota_exceeded' ? 'Depolama dolu, bazı kayıtları sil' : 'Kaydedilemedi, bağlantını kontrol et');
    });
    this.queue.set(id, next); return next;
  },
  async remove(id){
    this.people = this.people.filter(x => x.id !== id); render();
    if (this.mode === 'local'){ this.saveLocal(); return; }
    try { await (this.queue.get(id) || Promise.resolve()); await this.col.doc(id).delete(); } catch(e){ toast('Silinemedi, bağlantını kontrol et'); }
  },
  person(id){ return this.people.find(p => p.id === id); }
};

/* ---------------- dates ---------------- */
function today(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function parse(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function next(s, yearly){
  const d = parse(s); if(!d) return null; if(!yearly) return d;
  const t = today(); let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if (n < t) n = new Date(t.getFullYear()+1, d.getMonth(), d.getDate());
  return n;
}
const days = d => Math.round((d - today()) / 86400000);
function daysText(n){ return n===0?'Bugün':n===1?'Yarın':n===-1?'Dün':n<0?`${-n} gün önce`:`${n} gün sonra`; }
const fmtLong = s => parse(s).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const fmtDM = d => d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
function age(birth){
  const b = parse(birth), t = today();
  let a = t.getFullYear() - b.getFullYear();
  if (t < new Date(t.getFullYear(), b.getMonth(), b.getDate())) a--;
  return a;
}
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toLocaleUpperCase('tr') || '').join('');
const trLower = s => (s||'').toLocaleLowerCase('tr');

/* ---------------- ui state ---------------- */
const ui = { tab:'home', personId:null, q:'', cat:null, loaded:false, offline:false };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }

function catLabel(k){ const c = CATS[k] || CATS.diger; return `<span class="cat" style="--dot:${c.color}"><i></i>${c.name}</span>`; }

function upcoming(){
  const out = [];
  for (const p of store.people){
    if (p.birthday){ const n = next(p.birthday, true); out.push({p, d:n, cat:'ozel', text:`Doğum günü · ${age(p.birthday) + (days(n)===0?0:1)} yaşına giriyor`}); }
    for (const e of p.entries || []) if (e.date){ out.push({p, d:next(e.date, e.yearly), cat:e.cat, text:e.text}); }
  }
  return out;
}

/* ---------------- views ---------------- */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab && !ui.personId));
  $('#backBtn').hidden = !ui.personId;
  $('#headActs').innerHTML = '';
  if (ui.personId) return renderPerson();
  if (ui.tab === 'people') return renderPeople();
  if (ui.tab === 'settings') return renderSettings();
  renderHome();
}

function loadingBlock(){
  return `<div class="card empty"><b>Defter açılıyor…</b>Kayıtların yükleniyor.</div>`;
}

function renderHome(){
  $('#title').textContent = 'Yaklaşanlar';
  const v = $('#view');
  if (!ui.loaded){ v.innerHTML = loadingBlock(); return; }
  const list = upcoming().filter(x => { const n = days(x.d); return n >= 0 && n <= 60; }).sort((a,b) => a.d - b.d);
  const follow = [];
  for (const p of store.people) for (const e of p.entries || []) if (e.followup) follow.push({p,e});
  follow.sort((a,b) => b.e.created - a.e.created);

  const first = store.people.length === 0;
  v.innerHTML = `
    ${ui.offline ? `<div class="card empty" style="padding:12px">Bağlantı kurulamadı; gördüklerin güncel olmayabilir.</div>` : ''}
    ${first ? `
      <div class="card empty"><b>Defterin boş</b>Sağ alttaki <strong>+</strong> ile konuştuğun birini ve ondan öğrendiğin bir şeyi ekle. Doğum günleri ve tarihli bilgiler burada geri sayımla görünür.</div>` : ''}
    <div class="section">
      <h2>Önümüzdeki 60 gün</h2>
      <div class="card list">
        ${list.length ? list.map(x => {
          const n = days(x.d);
          return `<button class="row" data-open="${x.p.id}">
            <div class="when ${n===0?'today':''}"><b>${n===0?'—':n}</b><span>${n===0?'bugün':'gün'}</span></div>
            <div class="main"><div class="title">${esc(x.p.name)}</div>
              <div class="meta">${esc(x.text)}</div>
              <div class="meta">${catLabel(x.cat)} · ${fmtDM(x.d)}</div></div>
          </button>`; }).join('') : `<div class="empty">Yaklaşan bir tarih yok. Kişilere doğum günü ya da tarihli bilgi ekledikçe burada görünür.</div>`}
      </div>
    </div>
    <div class="section">
      <h2>Sonra sorulacaklar</h2>
      <div class="card list">
        ${follow.length ? follow.map(({p,e}) => `
          <div class="row">
            <div class="avatar">${esc(initials(p.name))}</div>
            <button class="main" data-open="${p.id}" style="border:0;background:none;padding:0;text-align:left">
              <div class="title">${esc(p.name)}</div>
              <div class="meta">${esc(e.text)}</div>
            </button>
            <button class="linkbtn" data-asked="${p.id}|${e.id}">Sordum</button>
          </div>`).join('') : `<div class="empty">Bilgi eklerken “Sonra sor” işaretlersen, bir dahaki görüşmede soracakların burada toplanır.</div>`}
      </div>
    </div>`;
}

function renderPeople(){
  $('#title').textContent = 'Kişiler';
  const v = $('#view');
  if (!ui.loaded){ v.innerHTML = loadingBlock(); return; }
  const q = trLower(ui.q);
  const ppl = [...store.people].sort((a,b) => a.name.localeCompare(b.name,'tr')).filter(p => !q ||
    trLower(p.name).includes(q) || trLower(p.relation).includes(q) || trLower(p.note).includes(q) ||
    (p.entries||[]).some(e => trLower(e.text).includes(q)));
  const hadFocus = document.activeElement?.id === 'search';
  v.innerHTML = `
    <input type="search" id="search" placeholder="İsim ya da bilgi ara (ör. satranç)" value="${esc(ui.q)}">
    <div class="section"><div class="card list">
      ${ppl.length ? ppl.map(p => `
        <button class="row" data-open="${p.id}">
          <div class="avatar">${esc(initials(p.name))}</div>
          <div class="main"><div class="title">${esc(p.name)}</div><div class="meta">${esc(p.relation || 'Yakınlık eklenmedi')}</div></div>
          <span class="count">${(p.entries||[]).length} bilgi</span>
        </button>`).join('') : `<div class="empty">${store.people.length ? 'Aramana uyan kimse yok.' : '<b>Henüz kimse yok</b>Sağ alttaki + ile ilk kişiyi ekle.'}</div>`}
    </div></div>`;
  const s = $('#search');
  s.oninput = () => { ui.q = s.value; const pos = s.selectionStart; renderPeople(); const n=$('#search'); n.focus(); n.setSelectionRange(pos,pos); };
  if (hadFocus) s.focus();
}

function renderPerson(){
  const p = store.person(ui.personId);
  const v = $('#view');
  if (!p){ ui.personId = null; return render(); }
  $('#title').textContent = p.name;
  $('#headActs').innerHTML = `<button class="iconbtn" id="editP" aria-label="Kişiyi düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></button>`;
  $('#editP').onclick = () => openPerson(p);
  const entries = (p.entries || []).slice().sort((a,b) => b.created - a.created);
  const counts = {}; entries.forEach(e => counts[e.cat] = (counts[e.cat]||0) + 1);
  const shown = entries.filter(e => !ui.cat || e.cat === ui.cat);
  let bd = '';
  if (p.birthday){ const n = next(p.birthday, true); bd = `<span class="fact">${fmtLong(p.birthday)} · ${age(p.birthday)} yaşında</span><span class="fact">Doğum günü: ${daysText(days(n)).toLocaleLowerCase('tr')}</span>${calLink(`${p.name} doğum günü`, p.birthday, true)}`; }
  v.innerHTML = `
    <div class="card profile">
      <div class="sub">${esc(p.relation || 'Yakınlık eklenmedi')}</div>
      ${bd ? `<div class="facts">${bd}</div>` : ''}
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    </div>
    <div class="section">
      <h2>Öğrendiklerin</h2>
      ${entries.length ? `<div class="chips">
        <button class="chip ${!ui.cat?'on':''}" data-cat="">Tümü · ${entries.length}</button>
        ${Object.keys(CATS).filter(k => counts[k]).map(k => `<button class="chip ${ui.cat===k?'on':''}" data-cat="${k}" style="--dot:${CATS[k].color}"><i></i>${CATS[k].name} · ${counts[k]}</button>`).join('')}
      </div>` : ''}
      <div class="card">
        ${shown.length ? shown.map(e => {
          let dt = '';
          if (e.date){ const n = next(e.date, e.yearly); dt = `<span>${fmtLong(e.date)}${e.yearly?' · her yıl':''} · ${daysText(days(n))}</span>${days(n) >= 0 ? calLink(`${p.name}: ${e.text}`, e.date, e.yearly) : ''}`; }
          return `<div class="entry">
            <div class="text">${esc(e.text)}</div>
            <div class="foot">${catLabel(e.cat)}${dt}${e.followup?'<span class="pill">Sonra sor</span>':''}
              <span class="acts"><button class="linkbtn" data-edit="${e.id}">Düzenle</button><button class="linkbtn danger" data-del="${e.id}">Sil</button></span></div>
            <div class="foot">Eklendi: ${new Date(e.created).toLocaleDateString('tr-TR')}</div>
          </div>`; }).join('') : `<div class="empty">Henüz bilgi yok. ${esc(p.name.split(' ')[0])} ile konuşunca öğrendiklerini + ile ekle.</div>`}
      </div>
    </div>
    <div class="section"><button class="btn danger block" id="delP">Kişiyi sil</button></div>`;
  v.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { ui.cat = b.dataset.cat || null; renderPerson(); });
  v.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEntry(p, p.entries.find(e => e.id === b.dataset.edit)));
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (await ask('Bu bilgi silinsin mi?', 'Geri alınamaz.')){
      await store.save({...p, entries: p.entries.filter(e => e.id !== b.dataset.del)}); toast('Bilgi silindi');
    }
  });
  $('#delP').onclick = async () => {
    if (await ask(`${p.name} silinsin mi?`, `Bu kişiyle ilgili ${(p.entries||[]).length} bilgi de silinecek. Geri alınamaz.`)){
      ui.personId = null; await store.remove(p.id); toast('Kişi silindi');
    }
  };
}

function renderSettings(){
  $('#title').textContent = 'Diğer';
  const total = store.people.reduce((s,p) => s + (p.entries||[]).length, 0);
  const st = store.mode === 'cloud'
    ? `<div class="status ok"><i></i>Hesabına kaydediliyor. Telefonda ve bilgisayarda aynı defteri görürsün; sadece sen görebilirsin.</div>`
    : store.mode === 'local'
    ? `<div class="status warn"><i></i>Kayıtların yalnızca bu cihazda, bu tarayıcıda tutuluyor. Kaybolmaması için ara sıra yedek al.</div>`
    : `<div class="status"><i></i>Bağlanıyor…</div>`;
  $('#view').innerHTML = `
    <div class="card help">${st}<div class="sub">${store.people.length} kişi · ${total} bilgi</div></div>
    <div class="section"><h2>Bildirimler</h2>
      <div class="card help">${notifyBlock()}</div>
    </div>
    <div class="section"><h2>Yedek</h2>
      <div class="card help">
        <div>Tüm kayıtlarını bir dosya olarak indir; gerekirse geri yükle.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary" id="exportBtn">Yedeği indir</button>
          <button class="btn" id="importBtn">Yedekten geri yükle</button>
        </div>
      </div>
    </div>
    <div class="section"><h2>Ana ekrana ekle</h2>
      <div class="card help">
        <div><strong>iPhone (Safari):</strong></div>
        <ol><li>Bu sayfayı Safari'de aç.</li><li>Alttaki Paylaş düğmesine dokun.</li><li>“Ana Ekrana Ekle”yi seç.</li></ol>
        <div><strong>Android (Chrome):</strong></div>
        <ol><li>Bu sayfayı Chrome'da aç.</li><li>Sağ üstteki ⋮ menüsüne dokun.</li><li>“Ana ekrana ekle”yi seç.</li></ol>
      </div>
    </div>`;
  $('#exportBtn').onclick = exportData;
  $('#importBtn').onclick = () => $('#importFile').click();
  const nb = $('#notifyBtn'); if (nb) nb.onclick = enableNotify;
  const tb = $('#testNotifyBtn'); if (tb) tb.onclick = testNotify;
}

/* ---------------- bildirimler ve takvim ---------------- */
const REM_URL = new URL('__kd/reminders', location.href).toString();
const notifySupported = () => 'Notification' in window && 'serviceWorker' in navigator;
function notifyBlock(){
  const note = `<div class="sub">Doğum günleri ve tarihli bilgiler için bir gün önce ve o gün bildirim gelir. Telefon, uygulama kapalıyken bildirimi geciktirebilir; kesin hatırlatma için kişinin sayfasındaki tarihlerde “Takvime ekle”yi kullan.</div>`;
  if (!notifySupported()) return `<div class="status warn"><i></i>Bu tarayıcı bildirim desteklemiyor. Tarihleri “Takvime ekle” ile telefonunun takvimine ekleyebilirsin.</div>`;
  const p = Notification.permission;
  if (p === 'granted') return `<div class="status ok"><i></i>Bildirimler açık.</div>${note}<div><button class="btn" id="testNotifyBtn">Deneme bildirimi gönder</button></div>`;
  if (p === 'denied') return `<div class="status warn"><i></i>Bildirimler engellenmiş. Chrome'da adres çubuğundaki kilit simgesine dokun, “İzinler”den bildirimlere izin ver.</div>${note}`;
  return `${note}<div><button class="btn primary" id="notifyBtn">Bildirimleri aç</button></div>`;
}
async function enableNotify(){
  let p = 'denied';
  try { p = await Notification.requestPermission(); } catch(e){}
  if (p !== 'granted'){ toast('Bildirim izni verilmedi'); render(); return; }
  try { await navigator.storage?.persist?.(); } catch(e){}
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.periodicSync?.register('kd-reminders', { minInterval: 12 * 60 * 60 * 1000 });
  } catch(e){}
  await syncReminders();
  toast('Bildirimler açıldı'); render();
}
async function testNotify(){
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Kişi Defteri', { body:'Bildirimler çalışıyor.', icon:'icon-192.png', tag:'kd-test' });
  } catch(e){ toast('Bildirim gösterilemedi'); }
}
let remTimer;
function syncReminders(){
  clearTimeout(remTimer);
  remTimer = setTimeout(async () => {
    if (!('caches' in window)) return;
    const items = [];
    for (const p of store.people){
      if (p.birthday) items.push({ key:p.id + ':bd', name:p.name, text:'Doğum günü', date:p.birthday, yearly:true, birthday:true });
      for (const e of p.entries || []) if (e.date) items.push({ key:p.id + ':' + e.id, name:p.name, text:e.text, date:e.date, yearly:!!e.yearly });
    }
    try {
      const c = await caches.open('kd-data');
      await c.put(REM_URL, new Response(JSON.stringify(items), { headers:{ 'content-type':'application/json' } }));
    } catch(e){ return; }
    if (notifySupported() && Notification.permission === 'granted'){
      try { const reg = await navigator.serviceWorker.ready; reg.active && reg.active.postMessage('check'); } catch(e){}
    }
  }, 400);
}
function calLink(title, dateStr, yearly){
  const d = parse(dateStr); if (!d) return '';
  const e = new Date(d); e.setDate(e.getDate() + 1);
  const f = x => `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}${String(x.getDate()).padStart(2,'0')}`;
  const u = new URL('https://calendar.google.com/calendar/render');
  u.searchParams.set('action', 'TEMPLATE');
  u.searchParams.set('text', title);
  u.searchParams.set('dates', `${f(d)}/${f(e)}`);
  u.searchParams.set('details', 'Kişi Defteri hatırlatması');
  if (yearly) u.searchParams.set('recur', 'RRULE:FREQ=YEARLY');
  return `<a class="linkbtn" href="${esc(u.toString())}" target="_blank" rel="noopener">Takvime ekle</a>`;
}

/* ---------------- actions ---------------- */
document.addEventListener('click', async ev => {
  const o = ev.target.closest('[data-open]');
  if (o){ ui.personId = o.dataset.open; ui.cat = null; render(); window.scrollTo(0,0); return; }
  const a = ev.target.closest('[data-asked]');
  if (a){
    const [pid, eid] = a.dataset.asked.split('|'); const p = store.person(pid); if(!p) return;
    await store.save({...p, entries: p.entries.map(e => e.id===eid ? {...e, followup:false} : e)}); toast('Listeden çıkarıldı');
  }
  if (ev.target.closest('[data-close]')) ev.target.closest('dialog').close();
});
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; ui.personId = null; render(); window.scrollTo(0,0); });
$('#backBtn').onclick = () => { ui.personId = null; render(); };
$('#fab').onclick = () => {
  if (ui.personId) openEntry(store.person(ui.personId));
  else if (ui.tab === 'people' || store.people.length === 0) openPerson(null);
  else openEntry(null);
};
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

let editingPerson = null;
function openPerson(p){
  editingPerson = p;
  $('#personDlgTitle').textContent = p ? 'Kişiyi düzenle' : 'Yeni kişi';
  $('#pName').value = p?.name || ''; $('#pRel').value = p?.relation || '';
  $('#pBirth').value = p?.birthday || ''; $('#pNote').value = p?.note || '';
  $('#personDlg').showModal(); setTimeout(() => $('#pName').focus(), 50);
}
$('#personForm').onsubmit = async ev => {
  ev.preventDefault();
  const name = $('#pName').value.trim(); if (!name) return;
  const data = { name, relation:$('#pRel').value.trim(), birthday:$('#pBirth').value, note:$('#pNote').value.trim() };
  $('#personDlg').close();
  if (editingPerson){ await store.save({...editingPerson, ...data}); toast('Kaydedildi'); }
  else { const p = { id:uid(), created:Date.now(), entries:[], ...data }; ui.personId = p.id; ui.cat = null; await store.save(p); toast(`${name} eklendi`); }
};

$('#eCats').innerHTML = Object.entries(CATS).map(([k,c],i) =>
  `<label><input type="radio" name="eCat" value="${k}" ${i===0?'checked':''}><span style="--dot:${c.color}"><i></i>${c.name}</span></label>`).join('');
$('#eCats').addEventListener('change', e => { if (e.target.value === 'ozel' && $('#eDate').value) $('#eYearly').checked = true; });
$('#eDate').addEventListener('change', () => { if (document.querySelector('[name=eCat]:checked').value === 'ozel') $('#eYearly').checked = true; });
$('#ePerson').addEventListener('change', () => { $('#eNewNameWrap').hidden = $('#ePerson').value !== '__new'; });

let editing = { person:null, entry:null };
function openEntry(person, entry){
  editing = { person, entry: entry || null };
  $('#entryDlgTitle').textContent = entry ? 'Bilgiyi düzenle' : (person ? `${person.name} hakkında` : 'Yeni bilgi');
  $('#ePersonWrap').hidden = !!person;
  if (!person){
    const opts = [...store.people].sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    $('#ePerson').innerHTML = opts + `<option value="__new">+ Yeni kişi…</option>`;
    $('#eNewNameWrap').hidden = store.people.length > 0;
    if (!store.people.length) $('#ePerson').value = '__new';
  } else $('#eNewNameWrap').hidden = true;
  $('#eNewName').value = '';
  const cat = entry?.cat || 'ozel';
  document.querySelector(`[name=eCat][value="${cat}"]`).checked = true;
  $('#eText').value = entry?.text || ''; $('#eDate').value = entry?.date || '';
  $('#eYearly').checked = !!entry?.yearly; $('#eFollow').checked = !!entry?.followup;
  $('#entryDlg').showModal(); setTimeout(() => $('#eText').focus(), 50);
}
$('#entryForm').onsubmit = async ev => {
  ev.preventDefault();
  const text = $('#eText').value.trim(); if (!text) return;
  let p = editing.person;
  if (!p){
    if ($('#ePerson').value === '__new'){
      const nm = $('#eNewName').value.trim(); if (!nm){ $('#eNewName').focus(); return; }
      p = { id:uid(), created:Date.now(), name:nm, relation:'', birthday:'', note:'', entries:[] };
    } else p = store.person($('#ePerson').value);
  } else p = store.person(p.id) || p;
  if (!p) return;
  const data = { cat:document.querySelector('[name=eCat]:checked').value, text, date:$('#eDate').value, yearly:$('#eYearly').checked && !!$('#eDate').value, followup:$('#eFollow').checked };
  const entries = editing.entry
    ? p.entries.map(e => e.id === editing.entry.id ? {...e, ...data} : e)
    : [...(p.entries||[]), { id:uid(), created:Date.now(), ...data }];
  $('#entryDlg').close();
  await store.save({...p, entries});
  toast(editing.entry ? 'Güncellendi' : 'Bilgi eklendi');
};

function ask(title, text){
  return new Promise(res => {
    const d = $('#confirmDlg'); $('#confirmTitle').textContent = title; $('#confirmText').textContent = text || '';
    const done = v => { d.close(); res(v); };
    $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false);
    d.onclose = () => res(false);
    d.showModal();
  });
}

async function exportData(){
  const json = JSON.stringify({ app:'kisi-defteri', exported:new Date().toISOString(), people:store.people }, null, 2);
  const name = `kisi-defteri-yedek-${new Date().toISOString().slice(0,10)}.json`;
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch(e){}
  if (dl){
    try { await dl.save({ filename:name, data:json }); toast('Yedek kaydedildi'); }
    catch(e){ if (e?.code !== 'declined') toast('Yedek indirilemedi'); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download = name; a.click(); }
  catch(e){ toast('Bu görünümde indirme yapılamıyor'); }
}
$('#importFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch(e){ toast('Dosya okunamadı'); return; }
  if (!d || !Array.isArray(d.people)){ toast('Bu bir Kişi Defteri yedeği değil'); return; }
  if (!await ask(`${d.people.length} kişi geri yüklensin mi?`, 'Aynı kişiler yedekteki haliyle güncellenir, diğer kayıtların kalır.')) return;
  for (const p of d.people){ if (p && p.id && p.name) await store.save({ entries:[], ...p }); }
  toast('Yedek yüklendi');
};

render();
store.init();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>

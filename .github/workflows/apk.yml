name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Web dosyalarını kopyala
        run: |
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png ../apple-touch-icon.png www/

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: İkon, izin ve sürüm numarası
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../icon-192.png "$RES/mipmap-$d/ic_launcher.png"
            cp ../icon-192.png "$RES/mipmap-$d/ic_launcher_round.png"
          done
          mkdir -p "$RES/drawable" && cp ic_stat_kd.xml "$RES/drawable/"
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MAN" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MAN"
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK derle
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: İmzala
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > ks.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias kd --ks-pass env:KS_PASS --key-pass env:KS_PASS --out KisiDefteri.apk aligned.apk
          "$BT/apksigner" verify KisiDefteri.apk
          rm -f ks.p12 aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KisiDefteri-apk
          path: android-app/KisiDefteri.apk

      - name: Sürüm olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${GITHUB_RUN_NUMBER}" KisiDefteri.apk \
            --title "Kişi Defteri Android 1.${GITHUB_RUN_NUMBER}" \
            --notes "Telefona KisiDefteri.apk dosyasını indirip açarak kur. Android, bilinmeyen kaynaktan kurulum için izin isteyebilir." \
            --latest
